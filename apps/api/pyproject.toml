[project]
name = "vlab-api"
version = "0.1.0"
description = "FastAPI service for the Intelligent Virtual Chemistry Laboratory (M1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "jsonschema>=4.26.0",
    "openai>=2",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-jsonschema>=4.26.0.20261006",
]
rag = [
    "sentence-transformers>=6.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional `rag` dependency group (local E5 model); imported lazily inside E5LocalProvider only.
module = ["huggingface_hub", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# OneDrive intermittently locks the cache directory during rename (WinError 5); the cache is not needed.
addopts = "-p no:cacheprovider"
